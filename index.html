<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>วัดกู้ Live — ทดลอง GPS รถ 16</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:system-ui,sans-serif;background:#f2f6fb;color:#13243a}header{background:#123c72;color:white;padding:16px}h1{font-size:20px;margin:0}header p{margin:5px 0 0}#map{height:55vh;min-height:300px}.panel{padding:16px}button{font:inherit;border:0;border-radius:10px;padding:13px 18px;margin:0 7px 10px 0;background:#1565c0;color:white}button.stop{background:#ad3030}#status{background:white;padding:12px;border-radius:10px;line-height:1.7}.note{font-size:13px;color:#536277}</style></head><body><header><h1>🚌 รถสองแถวสายวัดกู้ Live</h1><p>ทดลอง GPS รถเบอร์ 16 — ใช้ iPhone เครื่องเดียว</p></header><div id="map"></div><div class="panel"><button id="start">▶ เริ่ม GPS</button><button class="stop" id="stop">■ หยุด GPS</button><div id="status" role="status">สถานะ: ยังไม่เริ่มส่งตำแหน่ง</div><p class="note">ต้องเปิดเว็บผ่าน HTTPS และอนุญาตให้ใช้ตำแหน่ง • รุ่นนี้แสดงตำแหน่งบนเครื่องนี้เท่านั้น ยังไม่ได้ส่งขึ้นเซิร์ฟเวอร์ • เมื่อปิดหน้าจอ iPhone การติดตามอาจหยุด</p></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([13.91,100.5],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);let watch=null,marker=null,circle=null;const status=document.getElementById('status');document.getElementById('start').onclick=()=>{if(watch!==null)return;if(!navigator.geolocation){status.textContent='เบราว์เซอร์นี้ไม่รองรับ GPS';return}status.textContent='กำลังขออนุญาต GPS…';watch=navigator.geolocation.watchPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];if(!marker){marker=L.marker(ll).addTo(map).bindPopup('🚌 รถเบอร์ 16')}else marker.setLatLng(ll);if(!circle)circle=L.circle(ll,{radius:p.coords.accuracy,color:'#1565c0',fillOpacity:.08}).addTo(map);else{circle.setLatLng(ll);circle.setRadius(p.coords.accuracy)}map.setView(ll,17);status.textContent=`กำลังติดตามรถเบอร์ 16 | ความแม่นยำประมาณ ${Math.round(p.coords.accuracy)} เมตร | อัปเดต ${new Date().toLocaleTimeString('th-TH')}`},e=>{status.textContent='GPS ใช้งานไม่ได้: '+(e.code===1?'กรุณาอนุญาตตำแหน่งให้ Safari':e.message);if(e.code===1){navigator.geolocation.clearWatch(watch);watch=null}},{enableHighAccuracy:true,maximumAge:0,timeout:20000})};document.getElementById('stop').onclick=()=>{if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;status.textContent='หยุดติดตาม GPS แล้ว'};</script></body></html>
